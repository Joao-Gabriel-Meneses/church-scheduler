spring:
  datasource:
    # Ex.: jdbc:oracle:thin:@escala_tp?TNS_ADMIN=/wallet (wallet montada como volume)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}

server:
  servlet:
    session:
      cookie:
        secure: true

escala:
  # Endereço dos links que saem do app (lembrete de disponibilidade). DOMINIO é o mesmo do Caddy, no .env.
  url-base: https://${DOMINIO}
  admin:
    nome: ${ESCALA_ADMIN_NOME:Administrador}
    email: ${ESCALA_ADMIN_EMAIL:}
    senha: ${ESCALA_ADMIN_SENHA:}
  seguranca:
    # Obrigatória: assina o cookie "continuar conectado".
    chave-lembrar-me: ${ESCALA_CHAVE_LEMBRAR_ME}
