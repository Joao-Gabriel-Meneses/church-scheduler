spring:
  application:
    name: escala
  datasource:
    hikari:
      # O Autonomous DB Always Free aceita no máximo 30 sessões.
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Produção é Oracle 19c; testes e dev rodam no Oracle Free 23ai. Fixar a versão faz o Hibernate usar os
      # mesmos tipos (boolean como NUMBER(1), JSON como BLOB) e o mesmo SQL em todos os ambientes.
      jakarta:
        persistence:
          database-major-version: 19
          database-minor-version: 0
      hibernate:
        jdbc:
          time_zone: UTC
          fetch_size: 100
  web:
    locale: pt_BR
    locale-resolver: fixed
    resources:
      # URLs com hash do conteúdo (/css/app-<hash>.css): cache longo, no navegador e no Cloudflare, sem servir arquivo
      # velho depois de um deploy. Os templates usam @{...}, que o ResourceUrlEncodingFilter reescreve com o hash.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # O health consulta o banco; o healthcheck periódico mantém o Autonomous DB ativo.
      show-details: never

timefold:
  solver-manager:
    # Um solver por vez, para não tirar o processador da VM pequena das páginas. As gerações também esperam numa fila
    # de uma thread (GeracaoDaEscala), para cada uma ler o que a anterior gravou.
    parallel-solver-count: 1
  solver:
    termination:
      # A escala do mês sai em até 30 s; termina antes se a pontuação parar de melhorar por 5 s.
      spent-limit: 30s
      unimproved-spent-limit: 5s
