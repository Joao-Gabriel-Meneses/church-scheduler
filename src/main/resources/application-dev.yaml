spring:
  docker:
    compose:
      file: compose.dev.yaml
      lifecycle-management: start-only
  thymeleaf:
    cache: false

escala:
  # Endereço dos links que saem do app (lembrete de disponibilidade).
  url-base: http://localhost:8080
  # Só para desenvolvimento local. Em produção, use variáveis de ambiente.
  admin:
    nome: Administrador
    email: admin@escala.local
    senha: admin1234
  seguranca:
    chave-lembrar-me: chave-somente-para-dev
  # Seed de desenvolvimento (SeedDeDesenvolvimento): Mídia e Louvor com membros, funções, modelos e eventos.
  # Gerente da Mídia: paula.ribeiro@escala.local. Todos os membros entram com esta senha, menos a Carla Dias, que
  # fica com a senha provisória (provisoria-dev) para mostrar a troca obrigatória.
  dev:
    senha-dos-membros: membro1234
