<!DOCTYPE html>
<!--/*
    Exemplo do layout do gerente (desktop) na página de escalas, só no perfil dev. Dados de demonstração.
    É a única página em que a Toolbar traz "Gerar escala" como primário.
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/gerente :: pagina(~{::title}, ~{::#barra}, ~{::main})}">
<head>
    <title>Escalas · Layout do gerente · Escala</title>
</head>
<body>
<div id="barra" class="rt-toolbar">
    <div th:replace="~{componentes/navegacao :: seletorDePeriodo('Outubro 2026', '#', '#')}"></div>
    <span th:replace="~{componentes/badge :: badge(texto='Disponibilidade travada', variante='locked',
            classe='h-control-lg px-6')}"></span>
    <button th:replace="~{componentes/botao :: botaoIcone('settings-2', 'Regras')}"></button>
    <button th:replace="~{componentes/botao :: botao(texto='Gerar escala', icone='sparkles', tipo='button')}"></button>
</div>

<main class="flex flex-col gap-6">
    <header class="flex flex-wrap items-center gap-3">
        <h1 class="text-title">Mídia — Outubro</h1>
        <span th:replace="~{componentes/badge :: badge(texto='Rascunho', variante='draft')}"></span>
    </header>

    <div class="flex flex-col gap-2">
        <div th:replace="~{componentes/alerta :: alerta(titulo='12/10 · Culto de domingo — Transmissão sem ninguém',
                corpo='Os 3 disponíveis já estão no limite do mês ou são iniciantes com outro iniciante no evento.',
                regra='Regras: LIMITE_POR_PERIODO · MAX_POR_NIVEL_NO_EVENTO', acaoTexto='Preencher', acaoHref='#',
                icone=null)}"></div>
        <div th:replace="~{componentes/alerta :: alerta(titulo='Lucas Lima desistiu de 18/10 · Projeção',
                corpo='Indicou Bia Rocha como substituta (habilitada, sem violar regras rígidas).', regra=null,
                acaoTexto='Revisar', acaoHref='#', icone='arrow-left-right')}"></div>
    </div>

    <div class="rt-panel p-6">
        <p class="text-ink-muted">A grade da escala (ScheduleGrid) entra na Fase 3.</p>
    </div>
</main>
</body>
</html>
