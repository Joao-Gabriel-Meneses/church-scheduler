<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/simples :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Entrar · Escala</title>
</head>
<body>
<main id="conteudo" class="flex flex-1 flex-col items-center justify-center p-4">
    <div class="flex w-full max-w-sm flex-col gap-6">
        <header class="flex flex-col gap-1 text-center">
            <h1 class="text-title">Escala</h1>
            <p class="text-ink-muted">Entre para marcar sua disponibilidade e ver suas escalas.</p>
        </header>

        <th:block th:if="${param.erro}">
            <div th:replace="~{componentes/alerta :: alerta(titulo='E-mail ou senha inválidos.',
                    corpo='Confira os dois e tente de novo.')}"></div>
        </th:block>

        <form th:action="@{/login}" method="post" class="rt-panel flex flex-col gap-4 p-6">
            <div th:replace="~{componentes/formulario :: campo(rotulo='E-mail', nome='email', tipo='email',
                    autocomplete='username', obrigatorio=true, autofocus=true)}"></div>
            <div th:replace="~{componentes/formulario :: campo(rotulo='Senha', nome='senha', tipo='password',
                    autocomplete='current-password', obrigatorio=true)}"></div>
            <label th:replace="~{componentes/formulario :: caixaDeSelecao('Continuar conectado neste aparelho',
                    'lembrar')}"></label>
            <button th:replace="~{componentes/botao :: botao(texto='Entrar', classe='w-full justify-center')}"></button>
        </form>
    </div>
</main>
</body>
</html>
