<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/membro :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Início · Escala</title>
</head>
<body>
<main class="flex flex-col gap-4">
    <h1 class="text-title">Olá, <span sec:authentication="principal.nome">Nome</span>!</h1>
    <p class="text-ink-muted">Suas próximas escalas vão aparecer aqui.</p>
    <p sec:authorize="hasRole('ADMIN')">
        <span th:replace="~{componentes/badge :: badge('Administrador')}"></span>
    </p>
    <p><a th:replace="~{componentes/botao :: botao(texto='Trocar senha', variante='outline', href=@{/conta/senha},
            icone='lock', classe=null)}"></a></p>
</main>
</body>
</html>
