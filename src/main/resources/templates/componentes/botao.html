<!DOCTYPE html>
<!--/*
    Button e IconButton (docs/design/components/Button e IconButton).

    botao(texto): pílula com verbo no infinitivo, sentence case e sem ponto final ("Gerar escala", "Publicar").
        <button th:replace="~{componentes/botao :: botao('Salvar')}"></button>
        <a th:replace="~{componentes/botao :: botao(texto='Gerar escala', icone='sparkles', href=@{/escalas/gerar})}"></a>
      Opções, por nome:
        variante     primary (padrão; uma por tela) | dark (torna definitivo, dispara e-mail) | secondary | outline
        tamanho      'sm': 32px, só dentro de cartões e banners no desktop
        icone        ícone antes do texto; iconeFinal: depois dele (ex.: 'chevron-right')
        href         vira <a> (navegação); sem href é <button>
        tipo         type do <button>: submit (padrão) | button
        formulario   id de um <form> da página que o <button> envia (atributo form), para um botão fora do form
        classe       ajustes de layout do Tailwind, ex.: 'w-full justify-center'

    botaoIcone(icone, rotulo): botão circular. O rótulo vira aria-label e title, em pt-BR ("Travar disponibilidade").
      Opções: variante 'dark' | tamanho 'sm' (desktop, em cartões) ou 'lg' (toolbar) | href | tipo (padrão button) | classe

    Opção omitida herda a variável de mesmo nome do contexto (regra do Thymeleaf): não use esses nomes em variáveis de
    página, ou passe a opção explicitamente (ex.: icone=null).
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="botao(texto)"
          th:with="_classes=|rt-btn rt-btn--${variante ?: 'primary'}${tamanho == 'sm' ? ' rt-btn--sm' : ''}${classe != null ? ' ' + classe : ''}|">
    <a th:if="${href != null}" th:href="${href}" th:class="${_classes}"><th:block
            th:replace="~{componentes/botao :: conteudoDoBotao}"></th:block></a>
    <button th:unless="${href != null}" th:type="${tipo ?: 'submit'}" th:class="${_classes}"
            th:form="${formulario}"><th:block
            th:replace="~{componentes/botao :: conteudoDoBotao}"></th:block></button>
</th:block>

<th:block th:fragment="conteudoDoBotao">
    <th:block th:if="${icone != null}"><svg th:replace="~{componentes/icone :: icone(${icone})}"></svg></th:block>
    <th:block th:text="${texto}">Texto do botão</th:block>
    <th:block th:if="${iconeFinal != null}"><svg th:replace="~{componentes/icone :: icone(${iconeFinal})}"></svg></th:block>
</th:block>

<th:block th:fragment="botaoIcone(icone, rotulo)"
          th:with="_classes=|rt-icon-btn${variante == 'dark' ? ' rt-icon-btn--dark' : ''}${tamanho != null ? ' rt-icon-btn--' + tamanho : ''}${classe != null ? ' ' + classe : ''}|">
    <a th:if="${href != null}" th:href="${href}" th:class="${_classes}" th:aria-label="${rotulo}"
       th:title="${rotulo}"><svg th:replace="~{componentes/icone :: icone(${icone})}"></svg></a>
    <button th:unless="${href != null}" th:type="${tipo ?: 'button'}" th:class="${_classes}" th:aria-label="${rotulo}"
            th:title="${rotulo}"><svg th:replace="~{componentes/icone :: icone(${icone})}"></svg></button>
</th:block>

</body>
</html>
