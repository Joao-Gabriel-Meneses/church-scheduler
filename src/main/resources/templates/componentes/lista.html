<!DOCTYPE html>
<!--/*
    ListRow (docs/design/components/ListRow): linha com tile de ícone, título, subtítulo e chevron. Nas listas de
    cadastro, é o formato do celular; no desktop a mesma lista vira DataTable (componentes/tabela).
        <ul class="rt-list">
            <li th:each="funcao : ${funcoes}"><a th:replace="~{componentes/lista :: linha(titulo=${funcao.nome},
                sub=${funcao.resumo}, icone='monitor', href=@{/funcoes/{id}(id=${funcao.id})})}"></a></li>
        </ul>
      Opções, por nome:
        sub          o dado que importa, em label/ink-muted ("Experiente · 3 escalas em outubro")
        icone        ícone do tile de 48px
        href         linha clicável (<a> com chevron); sem href é só informação (<div>)
        selecionada  true: fundo brand-tint e aria-current
        etiqueta     Badge à direita do texto, com etiquetaTint (mint | rose | lemon): o ministério da linha
        observacao   uma linha a mais abaixo do subtítulo, em label/ink-muted ("Para sair desta escala agora, fale com
                     o gerente.")
        botaoTexto   botão contorno abaixo do texto que abre o Sheet de id botaoAbre, com botaoIcone (ex.: "Desistir",
                     em Minhas escalas). Use sem href: a linha não pode ser um link com um botão dentro.
    Opção omitida herda a variável de mesmo nome do contexto: passe null quando precisar.
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="linha(titulo)"
          th:with="_classes=|rt-list-row${selecionada == true ? ' rt-list-row--tint' : ''}|">
    <a th:if="${href != null}" th:href="${href}" th:class="${_classes}"
       th:aria-current="${selecionada == true} ? 'true' : null"><th:block
            th:replace="~{componentes/lista :: conteudoDaLinha}"></th:block><svg
            th:replace="~{componentes/icone :: icone('chevron-right')}"></svg></a>
    <div th:unless="${href != null}" th:class="${_classes}"><th:block
            th:replace="~{componentes/lista :: conteudoDaLinha}"></th:block></div>
</th:block>

<th:block th:fragment="conteudoDaLinha">
    <span th:if="${icone != null}" class="rt-list-row__icon"><svg
            th:replace="~{componentes/icone :: icone(${icone})}"></svg></span>
    <span class="rt-list-row__text">
        <span class="rt-list-row__title" th:text="${titulo}">Projeção</span>
        <span th:if="${sub != null}" class="rt-list-row__sub" th:text="${sub}">Experiente · 3 escalas em outubro</span>
        <span th:if="${observacao != null}" class="rt-list-row__sub" th:text="${observacao}">Para sair desta escala agora, fale
            com o gerente.</span>
        <span th:if="${botaoTexto != null}" class="mt-2"><button th:replace="~{componentes/botao ::
                botao(texto=${botaoTexto}, variante='outline', icone=${botaoIcone}, href=null, tipo='button',
                formulario=null, abre=${botaoAbre}, tamanho=null, iconeFinal=null, classe=null, copiar=null)}"></button></span>
    </span>
    <th:block th:if="${etiqueta != null}"><span th:replace="~{componentes/badge :: badge(texto=${etiqueta},
            variante=null, icone=null, tint=${etiquetaTint}, classe='flex-none')}"></span></th:block>
</th:block>

</body>
</html>
