# Perfil de produção: VM Oracle Cloud (ARM64) atrás do Cloudflare Tunnel, banco no Autonomous DB 19c.
# Só o que é próprio de produção. Pool do Hikari (10), dialeto 19, hash dos recursos estáticos, cookie HttpOnly e
# SameSite=Lax valem para todos os perfis e ficam no application.yaml. O ConfiguracaoDeProducaoTest confere o conjunto.
# Segredos só por variável de ambiente (.env na VM, fora do repositório), sem valor padrão aqui.

# Banco. Ex.: jdbc:oracle:thin:@escala_tp?TNS_ADMIN=/wallet (wallet montada como volume somente leitura).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# O cloudflared fala HTTP com o app e manda X-Forwarded-Proto/For. O Tomcat (RemoteIpValve) confia nas redes privadas,
# onde o Docker cria a rede do compose: assim o app sabe que a requisição é https (redirects e cookies Secure).
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# Actuator: o health é público (monitoramento e health check do compose) e só mostra detalhes ao admin logado.
# O info fica atrás do login.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Logs em JSON no stdout; o Docker guarda e faz a rotação (compose.prod.yaml).
logging.structured.format.console=ecs

# Endereço dos links que saem do app (lembrete de disponibilidade). DOMINIO vem do .env (escala.ibrp.com.br).
escala.url-base=https://${DOMINIO}
escala.admin.nome=${ESCALA_ADMIN_NOME:Administrador}
escala.admin.email=${ESCALA_ADMIN_EMAIL:}
escala.admin.senha=${ESCALA_ADMIN_SENHA:}
# Obrigatória: assina o cookie "continuar conectado".
escala.seguranca.chave-lembrar-me=${ESCALA_CHAVE_LEMBRAR_ME}
