name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/joao-gabriel-meneses/escala

jobs:
  qualidade:
    name: Hooks e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Mesmos hooks do commit local. Spotless roda no job de testes (verify); gitleaks roda abaixo sobre o histórico.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: spotless,gitleaks
      - name: Varrer segredos em todo o histórico (gitleaks)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  testes:
    name: Testes (unitários, integração no Oracle, Spotless, JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 7

  imagem:
    name: Imagem Docker (amd64 + arm64)
    needs: [qualidade, testes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # O estágio final do Dockerfile não tem RUN: o arm64 é gerado sem QEMU.
      # Fora da main a imagem só é construída (valida o Dockerfile), sem publicar.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
